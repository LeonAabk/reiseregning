<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reiseregning - Statens Satser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header card">
            <h1>Reiseregning 2026</h1>
            <div class="header-actions">
                <button type="button" class="btn btn-outline" onclick="savePersonalInfo()">Lagre Personinfo</button>
                <button type="button" class="btn btn-outline" onclick="showSavedReports()">Lagrede Reiser</button>
                <button type="button" class="btn btn-outline" onclick="saveExpenseReport()">Lagre Reise</button>
                <button type="button" class="btn btn-success" onclick="previewExpenseReport()">Forhåndsvis PDF</button>
            </div>
        </header>

        <form id="expense-form">
            <section class="card">
                <h2>1. Personopplysninger</h2>
                <div class="grid-row">
                    <div class="form-group"><label>Firma / Selskap</label><input type="text" id="emp-company" placeholder="F.eks. Mitt Firma AS"></div>
                    <div class="form-group"><label>Navn</label><input type="text" id="emp-name" required></div>
                    <div class="form-group"><label>Ansattnr</label><input type="text" id="emp-id"></div>
                    <div class="form-group"><label>Avdeling</label><input type="text" id="emp-dept"></div>
                </div>
                <div class="form-group"><label>Adresse</label><input type="text" id="emp-addr"></div>
            </section>

            <section class="card">
                <h2>2. Reiseinformasjon</h2>
                <div class="form-group" style="margin-bottom:15px;"><label>Formål</label><input type="text" id="travel-purpose" required></div>
                <div class="grid-row">
                    <div class="form-group"><label>Avreise</label><input type="datetime-local" id="departure-date"></div>
                    <div class="form-group"><label>Hjemkomst</label><input type="datetime-local" id="return-date"></div>
                    <div class="form-group"><label>Overnatting</label>
                        <select id="accommodation-type">
                            <option value="none">Ingen overnatting</option>
                            <option value="hotel">Hotell</option>
                            <option value="boarding">Annen overnatting med kokemuligheter</option>
                            <option value="private">Annen overnatting uten kokemuligheter</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Diettmodus</label>
                        <select id="diet-mode">
                            <option value="state">Statens satser</option>
                            <option value="taxfree">Trekkfri sats</option>
                        </select>
                    </div>
                </div>
                <div id="diet-summary" class="info-box" style="margin-top:15px; padding:10px; background:#f1f5f9; border-radius:5px;"></div>
                <div class="checkbox-group" style="margin-top:10px; display:flex; gap:15px;">
                    <label><input type="checkbox" class="meal-check" data-percent="0.2"> Frokost</label>
                    <label><input type="checkbox" class="meal-check" data-percent="0.3"> Lunsj</label>
                    <label><input type="checkbox" class="meal-check" data-percent="0.5"> Middag</label>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <h2>3. Kjøregodtgjørelse</h2>
                    <button type="button" class="btn btn-outline btn-small" onclick="addMileageRow()">+ Ny rad</button>
                </div>
                <table id="mileage-table">
                    <thead><tr><th>Dato</th><th>Fra</th><th>Til</th><th>Km</th><th>Pass.</th><th>Bom</th><th class="no-print"></th></tr></thead>
                    <tbody id="mileage-body"></tbody>
                </table>
            </section>

            <section class="card">
                <div class="card-header">
                    <h2>4. Andre utlegg</h2>
                    <button type="button" class="btn btn-outline btn-small" onclick="addExpenseRow()">+ Ny rad</button>
                </div>
                <table>
                    <thead><tr><th>Dato</th><th>Beskrivelse</th><th>Beløp</th><th class="no-print"></th></tr></thead>
                    <tbody id="expenses-body"></tbody>
                </table>
            </section>

            <section class="card">
                <h2>5. Signatur</h2>
                <div class="form-group" style="max-width:300px; margin-bottom:15px;"><label>Sted og dato</label><input type="text" id="final-date-place"></div>
                <div class="tab-container no-print">
                    <button type="button" class="tab-btn active" onclick="switchTab('draw')">Tegn</button>
                    <button type="button" class="tab-btn" onclick="switchTab('upload')">Last opp</button>
                </div>
                <div id="draw-tab"><canvas id="sig-canvas" width="500" height="150" style="border:1px solid #ccc; background:#fff; cursor:crosshair;"></canvas><br><button type="button" onclick="clearCanvas()" class="btn btn-text">Tøm</button></div>
                <div id="upload-tab" style="display:none;"><input id="sig-upload" type="file" onchange="handleSignatureUpload(event)"><div id="sig-preview-container"></div></div>
            </section>
        </form>

        <div class="sticky-summary no-print">
            <div class="totals-grid">
                <div class="total-item"><span class="total-label">Kjøring</span><span id="total-mileage" class="total-value">0 kr</span></div>
                <div class="total-item"><span class="total-label">Diett</span><span id="total-diet" class="total-value">0 kr</span></div>
                <div class="total-item"><span class="total-label">Utlegg</span><span id="total-other" class="total-value">0 kr</span></div>
                <div class="total-item"><span class="total-label">Sum</span><span id="grand-total" class="total-value">0 kr</span></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
