<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedriftsportal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .dashboard-container { max-width: 1200px; margin: 0 auto; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px; }
        .dashboard-header h1 { margin: 0; font-size: 1.8rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-left: 4px solid var(--accent-color); }
        .stat-card h4 { margin: 0 0 10px 0; color: #64748b; font-size: 0.9rem; text-transform: uppercase; }
        .stat-card .stat-value { font-size: 2rem; font-weight: bold; color: var(--primary-color); margin: 0; }
        .join-code-badge { background: #f1f5f9; padding: 5px 10px; border-radius: 6px; font-family: monospace; font-size: 1.1rem; border: 1px dashed var(--border-color); display: inline-flex; align-items: center; gap: 10px; }
        .data-section { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .data-section h3 { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px; }
        .data-table-container { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { text-align: left; padding: 12px 15px; border-bottom: 1px solid var(--border-color); }
        .data-table th { background: #f8fafc; font-weight: 600; color: #475569; text-transform: uppercase; font-size: 0.85rem; }
        .data-table tbody tr:hover { background: #f1f5f9; }
        .empty-state { text-align: center; padding: 40px 20px; color: #64748b; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
        .badge-draft { background: #e2e8f0; color: #475569; }
        .badge-submitted { background: #dbeafe; color: #1d4ed8; }
        .badge-approved { background: #dcfce7; color: #15803d; }
        .badge-paid { background: #fef08a; color: #854d0e; }
        .btn-small { padding: 5px 10px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="dashboard-container" id="dashboard-app">
        <!-- Dashboard content will be injected here by JS -->
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
